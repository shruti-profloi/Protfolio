<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f0f0f0}.calc{background:white;padding:20px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.1);width:280px}input{width:100%;height:50px;font-size:22px;text-align:right;margin-bottom:10px;border:1px solid #ddd;border-radius:8px;padding:5px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{height:50px;font-size:18px;border:none;border-radius:8px;background:#eee}button.equal{background:#4CAF50;color:white}</style>
</head><body><div class="calc"><h3 style="text-align:center">Shruti's Calculator</h3><input id="display" readonly><div class="buttons"><button onclick="c()">C</button><button onclick="v('/')">/</button><button onclick="v('*')">*</button><button onclick="v('-')">-</button><button onclick="v('7')">7</button><button onclick="v('8')">8</button><button onclick="v('9')">9</button><button onclick="v('+')">+</button><button onclick="v('4')">4</button><button onclick="v('5')">5</button><button onclick="v('6')">6</button><button onclick="e()" class="equal">=</button><button onclick="v('1')">1</button><button onclick="v('2')">2</button><button onclick="v('3')">3</button><button onclick="v('0')">0</button></div></div><script>let d=document.getElementById('display');function v(x){d.value+=x}function c(){d.value=''}function e(){try{d.value=eval(d.value)}catch{d.value='Error'}}</script></body></html>
