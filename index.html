<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shruti Portfolio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f0f0;padding:20px}
.container{max-width:400px;margin:auto}
.hero{background:white;padding:30px;border-radius:20px;text-align:center}
.card{background:white;padding:20px;border-radius:15px;margin-top:15px}
input,textarea{width:100%;padding:12px;margin-top:10px;border:1px solid #ccc;border-radius:10px}
.btn{width:100%;background:black;color:white;padding:12px;border-radius:30px;border:none;margin-top:15px;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<div class="hero">
<h1>Hi, I'm Aditya</h1>
<p>BCS 2nd Year Student</p>
</div>
<div class="card">
<h2>📩 Contact Me</h2>
<form action="https://formsubmit.co/beb1863f19d2830c2990a240a9c252f7" method="POST">
<input type="hidden" name="_captcha" value="false">
<input type="text" name="name" placeholder="Tuza Nav" required>
<input type="email" name="email" placeholder="Tujha Email" required>
<textarea name="message" rows="4" placeholder="Message liha..." required></textarea>
<button type="submit" class="btn">Send Message</button>
</form>
</div>
</div>
</body>
</html>
